<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mất kết nối - EduNest</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100svh;
                display: grid;
                place-items: center;
                padding: 16px;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                background: #ffffff;
                color: #0f172a;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0f172a;
                    color: #f8fafc;
                }
                p {
                    color: #cbd5e1;
                }
            }
            main {
                max-width: 420px;
                text-align: center;
            }
            img {
                width: 64px;
                height: 64px;
            }
            h1 {
                font-size: 1.5rem;
                margin: 16px 0 8px;
            }
            p {
                color: #475569;
                line-height: 1.6;
            }
            button {
                margin-top: 16px;
                border: 0;
                border-radius: 999px;
                padding: 10px 20px;
                font: inherit;
                font-weight: 600;
                background: #0f172a;
                color: #ffffff;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt="" />
            <h1>Bạn đang ngoại tuyến</h1>
            <p>
                EduNest cần kết nối mạng để mở bài học và lưu tiến độ. Kiểm tra
                kết nối rồi thử lại.
            </p>
            <button type="button" onclick="location.reload()">Thử lại</button>
        </main>
    </body>
</html>
